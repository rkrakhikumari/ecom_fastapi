version: '3.8'

services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234567
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    

  fastapi_app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db


